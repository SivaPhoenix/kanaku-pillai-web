<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Kanaku Pillai — track income, expenses and transfers across your accounts."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F3F1EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101113" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+Tamil:wght@600;700&display=swap"
    />
    <title>Kanaku Pillai</title>
    <script>
      // Applies the saved or system theme before first paint, so the page never flashes the wrong colours.
      (function () {
        try {
          var mode = localStorage.getItem("kp-theme") || "system";
          var dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <noscript>Kanaku Pillai needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
